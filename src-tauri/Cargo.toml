[package]
name = "quincha"
version = "0.1.0"
description = "Quincha Systems — app de escritorio offline-first"
authors = ["Quincha"]
edition = "2021"

[lib]
name = "quincha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
strip = true
lto = true
